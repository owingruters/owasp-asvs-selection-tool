# Hooks: language-agnostic checks plus the TypeScript toolchain (local hooks use npm).
# Install: pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg
minimum_pre_commit_version: '3.0.0'
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: prettier
        name: prettier (check)
        entry: npx prettier --check
        language: system
        types_or: [ts, tsx, javascript, json, css, markdown, yaml]
        exclude: ^(package-lock\.json|data/asvs/)
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        types_or: [ts, tsx, javascript]
      - id: typecheck
        name: tsc --noEmit
        entry: npm run typecheck
        language: system
        pass_filenames: false
        types_or: [ts, tsx]
